<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Emoji Kitchen - Mix Emojis</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                      background: linear-gradient(135deg, #ffe259, #ffa751);
                            min-height: 100vh;
                                  display: flex;
                                        justify-content: center;
                                              align-items: center;
                                                    font-family: 'Segoe UI', sans-serif;
                                                        }
                                                            .container {
                                                                  background: white;
                                                                        border-radius: 30px;
                                                                              box-shadow: 0 20px 40px rgba(0,0,0,0.2);
                                                                                    padding: 40px 30px;
                                                                                          max-width: 500px;
                                                                                                width: 90%;
                                                                                                      text-align: center;
                                                                                                          }
                                                                                                              h1 {
                                                                                                                    font-size: 2.5rem;
                                                                                                                          margin-bottom: 10px;
                                                                                                                              }
                                                                                                                                  .selectors {
                                                                                                                                        display: flex;
                                                                                                                                              justify-content: center;
                                                                                                                                                    gap: 20px;
                                                                                                                                                          margin: 30px 0;
                                                                                                                                                              }
                                                                                                                                                                  select {
                                                                                                                                                                        font-size: 2rem;
                                                                                                                                                                              padding: 10px;
                                                                                                                                                                                    border-radius: 20px;
                                                                                                                                                                                          border: 2px solid #ddd;
                                                                                                                                                                                                background: #f9f9f9;
                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                          }
                                                                                                                                                                                                              .result img {
                                                                                                                                                                                                                    max-width: 200px;
                                                                                                                                                                                                                          height: auto;
                                                                                                                                                                                                                                margin: 20px auto;
                                                                                                                                                                                                                                      display: block;
                                                                                                                                                                                                                                            border-radius: 20px;
                                                                                                                                                                                                                                                  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                          .result p {
                                                                                                                                                                                                                                                                color: #888;
                                                                                                                                                                                                                                                                      margin-top: 10px;
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                              .btn {
                                                                                                                                                                                                                                                                                    background: #ff6b6b;
                                                                                                                                                                                                                                                                                          color: white;
                                                                                                                                                                                                                                                                                                border: none;
                                                                                                                                                                                                                                                                                                      padding: 12px 30px;
                                                                                                                                                                                                                                                                                                            font-size: 1.2rem;
                                                                                                                                                                                                                                                                                                                  border-radius: 50px;
                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                              margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                    transition: transform 0.2s;
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                            .btn:hover { transform: scale(1.05); }
                                                                                                                                                                                                                                                                                                                                                .share-buttons {
                                                                                                                                                                                                                                                                                                                                                      margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                                                                                  justify-content: center;
                                                                                                                                                                                                                                                                                                                                                                        gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                .share-buttons button {
                                                                                                                                                                                                                                                                                                                                                                                      background: #eee;
                                                                                                                                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                        width: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                              height: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 1.5rem;
                                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                      <h1>🍳 Emoji Kitchen</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>Pick two emojis & see the magic!</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="selectors">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="emoji1"></select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                          <span style="font-size:2rem;">+</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <select id="emoji2"></select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="result" id="result">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <img id="comboImg" style="display:none;" alt="Emoji mix" crossorigin="anonymous" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p id="message"></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="btn" id="downloadBtn" style="display:none;">📥 Download as PNG</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="share-buttons" id="shareSection" style="display:none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button id="shareWhatsapp">💬</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="shareTwitter">🐦</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button id="copyLink">🔗</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p style="margin-top:30px; font-size:0.9rem; color:#666;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="https://github.com/yourusername/emoji-kitchen" target="_blank">⭐ Star on GitHub</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- html2canvas for download -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // ---------- EMOJI DATASET ----------
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Pair => image URL from Google's Emoji Kitchen CDN (unofficial, publicly accessible)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // We'll store a small handpicked set of combinations that definitely work.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const comboDB = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "😂+🥲": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f602/u1f602_u1f972.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "😂+😭": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f602/u1f602_u1f62d.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "😂+❤️": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f602/u1f602_u2764.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "🥰+😘": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f970/u1f970_u1f618.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "😍+🥰": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f60d/u1f60d_u1f970.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "🔥+💯": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f525/u1f525_u1f4af.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "🐶+🐱": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f436/u1f436_u1f431.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "🎉+🎂": "https://www.gstatic.com/android/keyboard/emojikitchen/20201001/u1f389/u1f389_u1f382.png",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // add more known combos...
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // All emojis to show in dropdowns (from set of first emojis in combos)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const allEmojis = [...new Set(Object.keys(comboDB).flatMap(k => k.split('+')))];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const emoji1Select = document.getElementById('emoji1');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const emoji2Select = document.getElementById('emoji2');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const comboImg = document.getElementById('comboImg');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const message = document.getElementById('message');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const downloadBtn = document.getElementById('downloadBtn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const shareSection = document.getElementById('shareSection');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Populate dropdowns
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function populateDropdown(selectEl) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    allEmojis.forEach(emoji => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const option = document.createElement('option');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    option.value = emoji;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            option.textContent = emoji;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    selectEl.appendChild(option);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  populateDropdown(emoji1Select);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      populateDropdown(emoji2Select);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Default selection
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              emoji1Select.value = '😂';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  emoji2Select.value = '🥲';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Try to show combo
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function showCombo() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const e1 = emoji1Select.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const e2 = emoji2Select.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const key1 = `${e1}+${e2}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const key2 = `${e2}+${e1}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const imgUrl = comboDB[key1] || comboDB[key2];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (imgUrl) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      comboImg.src = imgUrl;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              comboImg.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.textContent = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              downloadBtn.style.display = 'inline-block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shareSection.style.display = 'flex';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    comboImg.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.textContent = '😕 No combo found. Try another pair!';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    downloadBtn.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            shareSection.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          emoji1Select.addEventListener('change', showCombo);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              emoji2Select.addEventListener('change', showCombo);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showCombo();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Download as PNG
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          downloadBtn.addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const imgElement = comboImg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Use html2canvas on just the image container
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const canvas = await html2canvas(imgElement, { backgroundColor: null });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const link = document.createElement('a');
