<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Kitchen Pro - Mix Emojis</title>
  <meta name="description" content="Combine two emojis to create unique stickers using Google's Emoji Kitchen">
  
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8f9fa;
      --text: #212529;
      --subtext: #6c757d;
      --border: #dee2e6;
      --accent: #ff6b6b;
      --accent-hover: #ff5252;
      --shadow: 0 20px 40px rgba(0,0,0,0.08);
      --emoji-bg: #e9ecef;
    }

    .dark {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #e0e0e0;
      --subtext: #a0a0b0;
      --border: #2a2a4a;
      --accent: #ff6b6b;
      --accent-hover: #ff5252;
      --shadow: 0 20px 40px rgba(0,0,0,0.3);
      --emoji-bg: #2a2a4a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
      color: var(--text);
    }

    .container {
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 30px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #ff6b6b, #ffa751);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .theme-toggle {
      background: var(--emoji-bg);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover { transform: rotate(20deg); }

    .subtitle {
      color: var(--subtext);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    /* Emoji Grid Selector */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding: 12px;
      background: var(--emoji-bg);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .emoji-item {
      font-size: 2rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: all 0.2s;
      text-align: center;
      user-select: none;
    }
    .emoji-item:hover {
      background: rgba(255,107,107,0.2);
      transform: scale(1.2);
    }
    .emoji-item.selected {
      background: rgba(255,107,107,0.3);
      box-shadow: 0 0 0 3px var(--accent);
      border-radius: 8px;
    }

    .selected-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 3rem;
    }

    .plus-sign {
      font-size: 2rem;
      color: var(--subtext);
      font-weight: bold;
    }

    .emoji-box {
      background: var(--emoji-bg);
      padding: 12px;
      border-radius: 16px;
      border: 2px dashed var(--border);
      min-width: 70px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Result Section */
    .result-section {
      margin: 24px 0;
    }

    .result-image {
      max-width: 200px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      display: none;
      margin: 0 auto;
    }
    .result-image.show {
      display: block;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .loading-spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    .loading-spinner.active { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: #ff6b6b;
      margin-top: 12px;
      display: none;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 50px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,107,107,0.3);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Scrollbar */
    .emoji-grid::-webkit-scrollbar { width: 6px; }
    .emoji-grid::-webkit-scrollbar-track { background: transparent; }
    .emoji-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍳 Emoji Kitchen Pro</h1>
      <button class="theme-toggle" id="themeBtn" title="Toggle dark mode">🌓</button>
    </div>
    <p class="subtitle">Pick two emojis & create unique stickers!</p>

    <!-- Emoji Grid 1 -->
    <p style="font-weight:600; margin-bottom:4px; color:var(--subtext);">Select First Emoji</p>
    <div class="emoji-grid" id="grid1"></div>

    <div class="selected-row">
      <div class="emoji-box" id="selected1">😊</div>
      <span class="plus-sign">+</span>
      <div class="emoji-box" id="selected2">😂</div>
    </div>

    <!-- Emoji Grid 2 -->
    <p style="font-weight:600; margin-bottom:4px; color:var(--subtext);">Select Second Emoji</p>
    <div class="emoji-grid" id="grid2"></div>

    <!-- Result -->
    <div class="result-section">
      <div class="loading-spinner" id="spinner"></div>
      <img class="result-image" id="resultImg" alt="Emoji Mix" crossorigin="anonymous" />
      <p class="error-msg" id="errorMsg">⚠️ This combination isn't available. Try other emojis!</p>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button class="btn btn-primary" id="downloadBtn" disabled>
        📥 Download PNG
      </button>
      <button class="btn btn-outline" id="shareBtn" disabled>
        🔗 Copy Link
      </button>
    </div>

    <div class="footer">
      Made with ❤️ | <a href="https://github.com/Emoji Kitchen/emoji-kitchen-beta" target="_blank">⭐ Star on GitHub</a>
    </div>
  </div>

  <script>
    // ========== EMOJI DATASET ==========
    // Popular emojis with their unicode code points
    const emojiList = [
      { emoji: "😊", code: "1f60a" }, { emoji: "😂", code: "1f602" },
      { emoji: "🥰", code: "1f970" }, { emoji: "😍", code: "1f60d" },
      { emoji: "😘", code: "1f618" }, { emoji: "😭", code: "1f62d" },
      { emoji: "😡", code: "1f621" }, { emoji: "😱", code: "1f631" },
      { emoji: "🤗", code: "1f917" }, { emoji: "🤔", code: "1f914" },
      { emoji: "😎", code: "1f60e" }, { emoji: "🥳", code: "1f973" },
      { emoji: "😴", code: "1f634" }, { emoji: "🤩", code: "1f929" },
      { emoji: "😇", code: "1f607" }, { emoji: "🤯", code: "1f92f" },
      { emoji: "❤️", code: "2764" }, { emoji: "🔥", code: "1f525" },
      { emoji: "👍", code: "1f44d" }, { emoji: "👎", code: "1f44e" },
      { emoji: "🎉", code: "1f389" }, { emoji: "💯", code: "1f4af" },
      { emoji: "🌈", code: "1f308" }, { emoji: "⭐", code: "2b50" },
      { emoji: "🍕", code: "1f355" }, { emoji: "🍔", code: "1f354" },
      { emoji: "🐶", code: "1f436" }, { emoji: "🐱", code: "1f431" },
      { emoji: "🦊", code: "1f98a" }, { emoji: "🐼", code: "1f43c" },
      { emoji: "🌻", code: "1f33b" }, { emoji: "🌸", code: "1f338" },
      { emoji: "🎸", code: "1f3b8" }, { emoji: "⚽", code: "26bd" },
      { emoji: "🚀", code: "1f680" }, { emoji: "💡", code: "1f4a1" },
      { emoji: "🎂", code: "1f382" }, { emoji: "☕", code: "2615" },
      { emoji: "🍦", code: "1f366" }, { emoji: "👻", code: "1f47b" }
    ];

    // ========== STATE ==========
    let selected1 = emojiList[0]; // default 😊
    let selected2 = emojiList[1]; // default 😂

    // ========== DOM ELEMENTS ==========
    const grid1 = document.getElementById('grid1');
    const grid2 = document.getElementById('grid2');
    const selected1El = document.getElementById('selected1');
    const selected2El = document.getElementById('selected2');
    const resultImg = document.getElementById('resultImg');
    const spinner = document.getElementById('spinner');
    const errorMsg = document.getElementById('errorMsg');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const themeBtn = document.getElementById('themeBtn');

    // ========== RENDER EMOJI GRIDS ==========
    function renderGrid(gridEl, selectedEmoji, gridNum) {
      gridEl.innerHTML = '';
      emojiList.forEach(e => {
        const div = document.createElement('div');
        div.className = 'emoji-item';
        if (selectedEmoji.code === e.code) div.classList.add('selected');
        div.textContent = e.emoji;
        div.title = e.code;
        div.addEventListener('click', () => {
          if (gridNum === 1) {
            selected1 = e;
            selected1El.textContent = e.emoji;
            renderGrid(grid1, selected1, 1);
          } else {
            selected2 = e;
            selected2El.textContent = e.emoji;
            renderGrid(grid2, selected2, 2);
          }
          fetchEmojiMix();
        });
        gridEl.appendChild(div);
      });
    }

    // ========== FETCH EMOJI MIX FROM API ==========
    async function fetchEmojiMix() {
      const code1 = selected1.code;
      const code2 = selected2.code;

      // Reset state
      resultImg.classList.remove('show');
      errorMsg.style.display = 'none';
      spinner.classList.add('active');
      downloadBtn.disabled = true;
      shareBtn.disabled = true;

      // API URL (using emojik.vercel.app - free, no key needed)
      const url = `https://emojik.vercel.app/s/${code1}_${code2}?size=256`;

      try {
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error('Combination not available');
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);
        
        resultImg.src = imageUrl;
        resultImg.onload = () => {
          resultImg.classList.add('show');
          spinner.classList.remove('active');
          downloadBtn.disabled = false;
          shareBtn.disabled = false;
        };
      } catch (err) {
        // Try reverse order
        try {
          const url2 = `https://emojik.vercel.app/s/${code2}_${code1}?size=256`;
          const response2 = await fetch(url2);
          if (!response2.ok) throw new Error('Not available');
          
          const blob2 = await response2.blob();
          const imageUrl2 = URL.createObjectURL(blob2);
          
          resultImg.src = imageUrl2;
          resultImg.onload = () => {
            resultImg.classList.add('show');
            spinner.classList.remove('active');
            downloadBtn.disabled = false;
            shareBtn.disabled = false;
          };
        } catch (err2) {
          spinner.classList.remove('active');
          errorMsg.style.display = 'block';
          downloadBtn.disabled = true;
          shareBtn.disabled = true;
        }
      }
    }

    // ========== DOWNLOAD ==========
    downloadBtn.addEventListener('click', () => {
      if (!resultImg.src) return;
      const link = document.createElement('a');
      link.href = resultImg.src;
      link.download = `emoji-mix-${selected1.emoji}-${selected2.emoji}.png`;
      link.click();
    });

    // ========== COPY LINK ==========
    shareBtn.addEventListener('click', () => {
      const url = `https://emojik.vercel.app/s/${selected1.code}_${selected2.code}?size=256`;
      navigator.clipboard.writeText(url).then(() => {
        const originalText = shareBtn.innerHTML;
        shareBtn.innerHTML = '✅ Copied!';
        setTimeout(() => { shareBtn.innerHTML = originalText; }, 2000);
      });
    });

    // ========== DARK MODE TOGGLE ==========
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeBtn.textContent = isDark ? '☀️' : '🌓';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Load saved theme
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️';
    }

    // ========== INIT ==========
    renderGrid(grid1, selected1, 1);
    renderGrid(grid2, selected2, 2);
    selected1El.textContent = selected1.emoji;
    selected2El.textContent = selected2.emoji;
    fetchEmojiMix();
  </script>
</body>
</html>
